  accept
    condition = ${if eq {$interface_port}{25}{true}{false}}
    authenticated = *
  drop
    condition = ${if eq {$interface_port}{25}{true}{false}}
    condition = ${if match_domain{$sender_address_domain}{+local_domains}{false}{true}}
    !domains = +local_domains
    log_message = SFOX relay not permitted.
    message = ${run{/usr/local/bin/spfbl abuse $sender_host_address}{5.7.1 SpamFox (SFOX) relay not permitted}{relay not permitted}}
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    condition = ${if def:acl_c_begin_time {false}{true}}
    set acl_c_begin_time = $tod_epoch
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    set acl_c_session_time = ${eval:$tod_epoch - $acl_c_begin_time}
  defer
    condition = ${if eq {$interface_port}{25}{true}{false}}
    condition = ${if > {$acl_c_session_time}{120}}
    message = 421 4.4.2 SMTP session timeout. Please start a new SMTP session to finish this send.
    log_message = SFOX session timeout.
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    set acl_c_existent = null
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    domains = +local_domains
    set acl_c_existent = false
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    domains = +local_domains
    verify = recipient
    set acl_c_existent = true
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    condition = ${if eq {$address_data}{router\=virtual_aliases_nostar redirect\=""}{true}{false}}
    set acl_c_existent = true
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    logwrite = RECIPIENT VERIFY $local_part@$domain $address_data
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    set acl_c_spfbl = "NULL"
    set acl_c_spfbl_result = 0
  warn
    condition = ${if eq {$interface_port}{25}{true}{false}}
    set acl_c_spfbl = ${run{/usr/local/bin/spfbl query '$sender_host_address' \
                                                       '$sender_address' \
                                                       '$sender_helo_name' \
                                                       '$local_part@$domain' $acl_c_existent \
                            }{ERROR: $value}{$value}}
    set acl_c_spfbl = ${sg{$acl_c_spfbl}{^(.+)\\n}{\$1}}
    set acl_c_spfbl_result = $runrc
  deny
    condition = ${if eq {$acl_c_spfbl_result}{3}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) $sender_host_address is not allowed to send mail from $sender_address. See http://spfbl.net/en/feedback
    log_message = SFOX check failed.
  defer
    condition = ${if eq {$acl_c_spfbl_result}{6}{true}{false}}
    message = 4.7.1 SpamFox (SFOX) transient error occurred when checking SPF record. See http://spfbl.net/en/feedback
    log_message = SFOX check error.
  deny
    condition = ${if eq {$acl_c_spfbl_result}{7}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) one or more SPF records from $sender_host_address could not be interpreted. See http://spfbl.net/en/feedback
    log_message = SFOX check unknown.
  deny
    condition = ${if eq {$acl_c_spfbl_result}{13}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) sender has non-existent internet domain. See http://spfbl.net/en/feedback
    log_message = SFOX check nxdomain.
  deny
    condition = ${if eq {$acl_c_spfbl_result}{21}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) non-existent sender. See http://spfbl.net/en/feedback
    log_message = SFOX check nxsender.
  drop
    condition = ${if eq {$acl_c_spfbl_result}{14}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) invalid sender identification. See http://spfbl.net/en/feedback
    log_message = SFOX check invalid.
  defer
    condition = ${if eq {$acl_c_spfbl_result}{8}{true}{false}}
    condition = ${if match {$acl_c_spfbl}{^LISTED https?://}{true}{false}}
    message = 4.7.2 SpamFox (SFOX) $acl_c_spfbl
    log_message = SFOX check listed.
  defer
    condition = ${if eq {$acl_c_spfbl_result}{8}{true}{false}}
    message = 4.7.2 SpamFox (SFOX) temporarily blocked on this server. See http://spfbl.net/en/feedback
    log_message = SFOX check listed.
  deny
    condition = ${if eq {$acl_c_spfbl_result}{10}{true}{false}}
    condition = ${if match {$acl_c_spfbl}{^BLOCKED https?://}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) $acl_c_spfbl
    log_message = SFOX check blocked.
  deny
    condition = ${if eq {$acl_c_spfbl_result}{10}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) permanently blocked. See http://spfbl.net/en/feedback
    log_message = SFOX check blocked.
  drop
    condition = ${if eq {$acl_c_spfbl_result}{22}{true}{false}}
    message = 5.7.1 SpamFox (SFOX) permanently banned. See http://spfbl.net/en/feedback
    log_message = SFOX check banned.
  deny
    condition = ${if eq {$acl_c_spfbl_result}{19}{true}{false}}
    message = 5.1.1 SpamFox (SFOX) the account that you tried to reach does not exist. See http://spfbl.net/en/feedback
    log_message = SFOX check inexistent.
  discard
    condition = ${if eq {$acl_c_spfbl_result}{11}{true}{false}}
    log_message = SFOX check spamtrap.
  discard
    condition = ${if eq {$acl_c_spfbl_result}{23}{true}{false}}
    log_message = SFOX message released.
  discard
    condition = ${if eq {$acl_c_spfbl_result}{24}{true}{false}}
    log_message = SFOX message removed.
  deny
    condition = ${if eq {$acl_c_spfbl_result}{25}{true}{false}}
    message = 5.6.6 Message not found in the queued
    log_message = SFOX message not found.
  defer
    condition = ${if eq {$acl_c_spfbl_result}{12}{true}{false}}
    message = 4.7.1 SpamFox (SFOX) greylisted message. See http://spfbl.net/en/feedback
    log_message = SFOX check greylisting.
  defer
    condition = ${if eq {$acl_c_spfbl_result}{9}{true}{false}}
    message = 4.3.1 SpamFox (SFOX) temporarily out of service. See http://spfbl.net/en/feedback
    log_message = SFOX check timeout.
  defer
    condition = ${if eq {$acl_c_spfbl_result}{20}{true}{false}}
    message = 4.3.1 SpamFox (SFOX) temporarily out of service. See http://spfbl.net/en/feedback
    log_message = SFOX out of service.
  warn
    condition = ${if match {$acl_c_spfbl}{^(PASS |SOFTFAIL |NEUTRAL |NONE |FAIL |FLAG |WHITE |HOLD )}{true}{false}}
    set acl_c_spfblticket = ${sg{$acl_c_spfbl}{(PASS |SOFTFAIL |NEUTRAL |NONE |FAIL |FLAG |WHITE |HOLD )}{}}
    set acl_c_spfblticket = ${sg{$acl_c_spfblticket}{https?://.+/([0-9a-zA-Z_-]+)\$}{\$1}}
    set acl_c_spfblticketset = $acl_c_spfblticket;$acl_c_spfblticketset

# Install as /etc/nginx/sites-available/matrix.hadcloud.srv.br
server {
    listen 80;
    listen [::]:80;
    server_name matrix.hadcloud.srv.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://matrix.hadcloud.srv.br$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.hadcloud.srv.br;

    ssl_certificate /etc/letsencrypt/live/matrix.hadcloud.srv.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.hadcloud.srv.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:spfbl_tls:10m;
    ssl_session_tickets off;

    # Legacy :8080 links may be upgraded to HTTPS by the browser's HSTS policy.
    # The external :8080 compatibility NAT must target this TLS listener.
    error_page 497 =301 https://matrix.hadcloud.srv.br$request_uri;
    if ($http_host ~* :8080$) {
        return 301 https://matrix.hadcloud.srv.br$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 16m;

    location = / {
        return 302 /pt/;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host matrix.hadcloud.srv.br;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_redirect http://matrix.hadcloud.srv.br:8080/ https://matrix.hadcloud.srv.br/;
        proxy_cookie_flags ~ secure httponly samesite=lax;
        sub_filter_types *;
        sub_filter_once off;
        sub_filter 'http://matrix.hadcloud.srv.br:8080' 'https://matrix.hadcloud.srv.br';
    }
}

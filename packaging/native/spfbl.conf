# SPFBL upstream configuration. HTTP is exposed only through the local Nginx proxy.
hostname=matrix.hadcloud.srv.br
admin_email=postmaster@hadcloud.com.br
http_port=8080
log_folder=/var/log/had-antispam/
log_expires=14
log_level=INFO
whois_server_br=NONE

# Upstream binds ADMIN and HTTP on wildcard addresses. The VM firewall blocks
# external 9875 and 8080; Nginx reaches HTTP over loopback. TCP 9877 is
# restricted to cPanel source addresses. UDP 9877 remains available for SPFBL P2P.
admin_port=9875
spfbl_port=9877
# Optional upstream DNSBL listener on UDP 53. If enabled, disable the local
# systemd-resolved stub and configure its resolver to use the upstream DNS.
#dnsbl_port=53
spfbl_limit=127

inexistent_expires=365
udp_max=512
defer_time_flood=0
defer_time_softfail=1
defer_time_yellow=25
defer_time_red=1435
defer_time_hold=7175
reverse_required=false
advertisement_show=false

# Candidate only. Native stunnel4 with an independent pilot CA and mTLS.
# Firewall must allow ONLY explicitly enrolled MTA source IPs on 11933/11932.
foreground = yes
client = no
sslVersionMin = TLSv1.2
cert = /etc/spamfox-pilot/tls/server.crt
key = /etc/spamfox-pilot/tls/server.key
CAfile = /etc/spamfox-pilot/tls/client-ca.crt
verifyChain = yes
requireCert = yes

[spamfox-exim]
accept = 151.242.41.35:11933
connect = 127.0.0.1:11333

[spamfox-postfix]
accept = 151.242.41.35:11932
connect = 127.0.0.1:11336

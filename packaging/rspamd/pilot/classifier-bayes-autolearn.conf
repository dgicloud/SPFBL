# HAD-ANTISPAM-RSPAMD-MANAGED
new_schema = true;
backend = "redis";
min_tokens = 11;
min_learns = 200;
learn_condition = <<EOD
local logger = require "rspamd_logger"
local bayes_learn = require "lua_bayes_learn"
local safe_guards = {
  probability_check = "already_confident_target_class",
  bypass_header = "learn_type_guard",
}
return function(task, is_spam, is_unlearn)
  local allowed, reason, details = bayes_learn.can_learn(task, is_spam, is_unlearn)
  local settings = task:get_settings()
  if type(settings) == "table" and settings.spamfox_content_monitor_autolearn == true then
    local class = is_spam and "spam" or "ham"
    if allowed then
      logger.messagex("SpamFox Bayes learn_guard=allow class=%s", class)
    else
      local guard = type(details) == "table" and details.guard or nil
      local reason_code = safe_guards[guard] or "blocked_by_guard"
      logger.messagex("SpamFox Bayes learn_guard=%s class=%s", reason_code, class)
    end
  end
  return allowed, reason, details
end
EOD;
# Keep this as the native Lua-string form: the UCL object form short-circuits
# learning whenever BAYES_HAM/BAYES_SPAM is already present, preventing the
# classifier from correcting a weak or wrong existing Bayes verdict. The
# shared helper retains queue/local/auth guards, score thresholds, and balance.
autolearn = <<EOD
local logger = require "rspamd_logger"
local bayes_learn = require "lua_bayes_learn"
local safe_reasons = {
  ["not an enrolled SpamFox content-monitor scan"] = "profile_not_applied",
  ["MTA queue id is missing"] = "queue_id_missing",
  ["queue id is missing"] = "queue_id_missing",
  ["SMTP envelope sender is missing"] = "smtp_sender_missing",
  ["authenticated SMTP is excluded"] = "authenticated_smtp",
  ["local or authed network"] = "local_or_authenticated_network",
  ["verdict passthrough"] = "verdict_passthrough",
  ["spam balance check failed"] = "class_balance_guard",
  ["ham balance check failed"] = "class_balance_guard",
}
return function(task)
  local decision, reason, details = bayes_learn.autolearn(task, {
    spam_threshold = 15.0,
    junk_threshold = 6.0,
    ham_threshold = -2.0,
    check_balance = true,
    min_balance = 0.9,
    options = {
      logging = { enabled = false; }
    }
  })
  -- Only diagnose tasks where Rspamd actually applied the enrolled content profile.
  -- Log fixed reason codes only: never message IDs, addresses, headers or content.
  local settings = task:get_settings()
  if type(settings) == "table" and settings.spamfox_content_monitor_autolearn == true then
    if decision == "spam" or decision == "ham" then
      logger.messagex("SpamFox Bayes autolearn_candidate=%s", decision)
    else
      local detail_reason = type(details) == "table" and details.reason or nil
      local reason_code = safe_reasons[reason] or safe_reasons[detail_reason]
      local verdict = type(details) == "table" and details.verdict or nil
      if not reason_code then
        if verdict == "uncertain" then
          reason_code = "uncertain_verdict"
        elseif verdict == "ham" or verdict == "junk" or verdict == "spam" then
          reason_code = "below_confidence_threshold"
        else
          reason_code = "no_confident_verdict"
        end
      end
      logger.messagex("SpamFox Bayes autolearn_skipped=%s", reason_code)
    end
  end
  return decision, reason, details
end
EOD;

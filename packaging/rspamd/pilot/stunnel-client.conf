# Candidate only. Individual client certificate/key per enrolled MTA.
foreground = yes
client = yes
sslVersionMin = TLSv1.2
cert = /etc/spamfox-pilot/tls/client.crt
key = /etc/spamfox-pilot/tls/client.key
CAfile = /etc/spamfox-pilot/tls/server-ca.crt
verifyChain = yes
checkHost = matrix.hadcloud.srv.br

[spamfox-exim]
accept = 127.0.0.1:11335
connect = matrix.hadcloud.srv.br:11933

[spamfox-postfix]
accept = 127.0.0.1:11336
connect = matrix.hadcloud.srv.br:11932

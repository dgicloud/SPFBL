# BEGIN HAD-ANTISPAM-MONITOR
# Monitor only. Place in cPanel's ACL_RECIPIENT_BLOCK/custom_begin_recipient.
# The adapter response is observational; this warn never changes SMTP acceptance.
  warn
    set acl_m_had_antispam_result = ${readsocket{/run/had-antispam/monitor.sock}{$sender_host_address\x1f$sender_address\x1f$sender_helo_name\x1f$local_part@$domain\x1fnull}{1s}{ }{CONTINUE|socket_error}}
    set acl_m_had_antispam_ticket = ${if eq{${extract{5}{|}{$acl_m_had_antispam_result}}}{}{-}{${extract{5}{|}{$acl_m_had_antispam_result}}}}
    set acl_m_had_antispam_ticket_set = ${if eq{$acl_m_had_antispam_ticket}{-}{$acl_m_had_antispam_ticket_set}{${if eq{$acl_m_had_antispam_ticket_set}{}{$acl_m_had_antispam_ticket}{$acl_m_had_antispam_ticket_set;$acl_m_had_antispam_ticket}}}}
    logwrite = HAD AntiSpam MONITOR RCPT ${extract{1}{|}{$acl_m_had_antispam_result}}|${extract{2}{|}{$acl_m_had_antispam_result}}|${extract{3}{|}{$acl_m_had_antispam_result}}|${extract{4}{|}{$acl_m_had_antispam_result}}
  warn
    condition = ${if eq{${extract{6}{|}{$acl_m_had_antispam_result}}}{-}{false}{true}}
    condition = ${if eq{$acl_m_had_antispam_feedback}{}{true}{false}}
    set acl_m_had_antispam_feedback = ${extract{6}{|}{$acl_m_had_antispam_result}}
# END HAD-ANTISPAM-MONITOR

sfox_content_pipe:
  driver = pipe
  environment = SFOX_BSMTP=1:SFOX_QUEUE_ID_B64=${base64:$message_exim_id}:SFOX_SENDER_B64=${base64:$sender_address}:SFOX_RECIPIENTS_B64=${base64:$recipients}:SFOX_CLIENT_IP_B64=${base64:$sender_host_address}:SFOX_HELO_B64=${base64:$sender_helo_name}:SFOX_RECEIVED_PORT_B64=${base64:$received_port}

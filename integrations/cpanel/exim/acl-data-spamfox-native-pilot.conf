# BEGIN SPAMFOX-NATIVE-CONTENT-PILOT
# Candidate only: single approved recipient, with SPAMFOX_PILOT_MODE macro.
# Requires the RCPT hook to set acl_m_sfox_canary=yes for the approved mailbox.
# spamd_address must select the private central tunnel ONLY while scan=yes.
# Other content scanners must keep their original spamd_address branch.
warn
  set acl_m_sfox_scan = no
  set acl_m_sfox_done = no
  set acl_m_sfox_mode = SPAMFOX_PILOT_MODE

warn
  condition = ${if eq{$acl_m_sfox_canary}{yes}{yes}{no}}
  condition = ${if eq{$recipients_count}{1}{yes}{no}}
  condition = ${if !eq{$sender_host_address}{}{yes}{no}}
  condition = ${if !eq{$received_protocol}{spam-scanner}{yes}{no}}
  !authenticated = *
  remove_header = X-SpamFox-Result : X-SpamFox-Score : X-SpamFox-Engine : X-SpamFox-Mode : X-SpamFox-Status

warn
  condition = ${if eq{$acl_m_sfox_canary}{yes}{yes}{no}}
  condition = ${if eq{$recipients_count}{1}{yes}{no}}
  condition = ${if !eq{$sender_host_address}{}{yes}{no}}
  condition = ${if !eq{$received_protocol}{spam-scanner}{yes}{no}}
  !authenticated = *
  condition = ${if <= {$message_size}{25M}{yes}{no}}
  set acl_m_sfox_scan = yes
  spam = spamfox:true / defer_ok / tmo=12s
  condition = ${if match{$spam_action}{\N^(no action|add header|rewrite subject|reject|quarantine|discard|soft reject|greylist)$\N}{yes}{no}}
  set acl_m_sfox_action = $spam_action
  set acl_m_sfox_score = $spam_score
  set acl_m_sfox_done = yes

# Unconditional reset is essential even when spam/defer_ok above fails.
warn
  set acl_m_sfox_scan = no

warn
  condition = ${if eq{$acl_m_sfox_done}{yes}{yes}{no}}
  set acl_m_sfox_mark = ${if match{$acl_m_sfox_action}{\N^(add header|rewrite subject|reject|quarantine|discard)$\N}{yes}{no}}
  add_header = X-SpamFox-Result: $acl_m_sfox_action
  add_header = X-SpamFox-Score: $acl_m_sfox_score
  add_header = X-SpamFox-Engine: Rspamd
  add_header = X-SpamFox-Mode: $acl_m_sfox_mode
  add_header = X-SpamFox-Status: ${if eq{$acl_m_sfox_mark}{yes}{spam}{unmarked}}
  log_message = SpamFox content pilot mode=$acl_m_sfox_mode action=$acl_m_sfox_action score=$acl_m_sfox_score

# Native queue freeze, limited to a single approved recipient. Never reject/discard.
warn
  condition = ${if eq{$acl_m_sfox_done}{yes}{yes}{no}}
  condition = ${if eq{$acl_m_sfox_mode}{quarantine}{yes}{no}}
  condition = ${if match{$acl_m_sfox_action}{\N^(reject|quarantine|discard)$\N}{yes}{no}}
  control = freeze
  log_message = SpamFox content pilot held in native Exim queue
# END SPAMFOX-NATIVE-CONTENT-PILOT

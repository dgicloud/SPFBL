# BEGIN HAD-ANTISPAM-HEADER-MONITOR
# Monitor only. Place in ACL_CHECK_MESSAGE_PRE_BLOCK/custom_begin_check_message_pre.
# Sends upstream HEADER metadata for valid RCPT tickets; its result never changes delivery.
  warn
    set acl_m_had_antispam_header_result = ${readsocket{/run/had-antispam/monitor.sock}{HEADER\x1f$acl_m_had_antispam_ticket_set\x1f$acl_c_dkim_domain_set\x1f$h_From:\x1f$h_Reply-To:\x1f$h_Message-ID:\x1f$h_In-Reply-To:\x1f$message_exim_id\x1f$h_Date:\x1f$h_List-Unsubscribe:\x1f$h_Subject:}{1s}{ }{CONTINUE|header|socket_error|0}}
    logwrite = HAD AntiSpam MONITOR DATA ${extract{1}{|}{$acl_m_had_antispam_header_result}}|${extract{2}{|}{$acl_m_had_antispam_header_result}}|${extract{3}{|}{$acl_m_had_antispam_header_result}}|${extract{4}{|}{$acl_m_had_antispam_header_result}}
# END HAD-ANTISPAM-HEADER-MONITOR

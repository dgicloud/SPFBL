# BEGIN HAD-ANTISPAM-HEADER-MONITOR
# Monitor only. Place in ACL_CHECK_MESSAGE_PRE_BLOCK/custom_begin_check_message_pre.
# Sends upstream HEADER metadata for valid RCPT tickets; its result never changes delivery.
  warn
    set acl_m_had_antispam_header_result = ${readsocket{/run/had-antispam/monitor.sock}{HEADER\x1f$acl_m_had_antispam_ticket_set\x1f$acl_c_dkim_domain_set\x1f$h_From:\x1f$h_Reply-To:\x1f$h_Message-ID:\x1f$h_In-Reply-To:\x1f$message_exim_id\x1f$h_Date:\x1f$h_List-Unsubscribe:\x1f$h_Subject:\x1f\x1f\x1f\x1f\x1f\x1f${extract{3}{|}{$acl_m_had_antispam_result}}\x1f\x1f\x1f${if eq{$sender_host_authenticated}{}{false}{true}}\x1f${if eq{$tls_in_cipher}{}{false}{true}}}{1s}{ }{CONTINUE|header|socket_error|0}}
    logwrite = SFOX MONITOR DATA ${extract{1}{|}{$acl_m_had_antispam_header_result}}|${extract{2}{|}{$acl_m_had_antispam_header_result}}|${extract{3}{|}{$acl_m_had_antispam_header_result}}|${extract{4}{|}{$acl_m_had_antispam_header_result}}
  warn
    remove_header = X-HAD-AntiSpam-Ticket
  warn
    condition = ${if eq{$interface_port}{25}{true}{false}}
    !authenticated = *
    !hosts = +recent_authed_mail_ips
    condition = ${if eq{$recipients_count}{1}{true}{false}}
    condition = ${if def:acl_m_had_antispam_feedback {true}{false}}
    add_header = X-HAD-AntiSpam-Ticket: $acl_m_had_antispam_feedback
    logwrite = SFOX MONITOR FEEDBACK-TICKET eligible single-recipient
# END HAD-ANTISPAM-HEADER-MONITOR
